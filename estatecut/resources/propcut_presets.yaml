warm_cozy:
  filter: colorbalance=rm=0.04:bm=-0.03:pl=1,vibrance=intensity=0.1,eq=gamma=1.02
clean_gray:
  filter: eq=saturation=0.9:gamma=1.03,colorbalance=bm=0.015:rm=-0.01:pl=1
