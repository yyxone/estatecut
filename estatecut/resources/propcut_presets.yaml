neutral:
  filter: ''
bright_interior:
  filter: eq=brightness=0.06:contrast=1.06:saturation=1.1
warm_interior:
  filter: colorbalance=bs=0.06:bm=0.03,eq=saturation=0.97:contrast=1.03
cloudy_exterior:
  filter: eq=contrast=1.1:saturation=1.15:brightness=0.03
luxury_clean:
