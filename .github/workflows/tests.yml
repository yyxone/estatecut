name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      ESTATECUT_ENCODER: libx264
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-09-28
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified 2026-09-28
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install ".[dev]"
      - run: python -B -m pytest -q -p no:cacheprovider
      - run: python -m build --wheel
      - name: Install wheel outside source checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/estatecut-consumer"
          "$RUNNER_TEMP/estatecut-consumer/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          estate_python="$RUNNER_TEMP/estatecut-consumer/bin/python"
          "$estate_python" -I -m propcut --help
          "$estate_python" -I -m talkcut smoke --out "$RUNNER_TEMP/estatecut-smoke"
